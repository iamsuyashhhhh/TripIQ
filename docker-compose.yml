services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tripiq
      POSTGRES_USER: tripiq
      POSTGRES_PASSWORD: tripiq
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripiq -d tripiq']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tripiq:tripiq@db:5432/tripiq
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  postgres_data:
